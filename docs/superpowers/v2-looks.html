<title>Prata Raja v2 Looks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: four phone screens in a row.
   Three rules hold every screen together:
   1. One material: everything (sprites AND interface) is a paper cut-out with the same white edge and the same hard shadow.
   2. One angle: characters, pests and props are upright standees on a flat paper ground (each casts the same ground shadow).
   3. One typeface (Baloo Thambi 2) in three sizes, one card shape, no tilts. */
:root{ --page:#E7E1D5; --pageInk:#231A12; --pageMuted:#6F6355; --face:"Baloo Thambi 2", "Trebuchet MS", system-ui, sans-serif; }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#15120F;--pageInk:#EFE6D6;--pageMuted:#A99C8B;color-scheme:dark}}
:root[data-theme="dark"]{--page:#15120F;--pageInk:#EFE6D6;--pageMuted:#A99C8B;color-scheme:dark}
body{background:var(--page);color:var(--pageInk);font-family:var(--face);padding-inline:16px;padding-block:28px 48px}
.wrap{max-width:1340px;margin:0 auto;display:grid;gap:18px}
.top h1{margin:0;font-weight:800;font-size:36px;line-height:1}
.top p{margin:6px 0 0;color:var(--pageMuted);font-size:16px;font-weight:500;max-width:66ch;line-height:1.4}
.row{display:flex;gap:22px;overflow-x:auto;padding-bottom:12px}
figure{margin:0;flex:0 0 auto;display:grid;gap:6px}
figcaption{font-size:15px;font-weight:500;color:var(--pageMuted);max-width:300px;line-height:1.35}
figcaption b{color:var(--pageInk);font-weight:800;margin-right:6px}

/* ── Game screens: one paper palette, five colours ── */
.ph{--ground:#C9A877;--paper:#FFF8EA;--ink:#2B1F16;--tomato:#DE4A3A;--turmeric:#F2B134;--leafInk:#1E6B35;--road:#6F6A63;--roadEdge:#57524C;--muted:#6F6355;
  --edge:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(3px 4px 0 rgba(43,31,22,.3));
  width:300px;height:620px;border-radius:26px;overflow:hidden;position:relative;background:var(--ground);font-family:var(--face);color:var(--ink);font-size:15px;line-height:1.25;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.ph *{box-sizing:border-box}
.num{font-variant-numeric:tabular-nums lining-nums}
/* type: three sizes only */
.t1{font-size:28px;font-weight:800;line-height:1}
.t2{font-size:18px;font-weight:800;line-height:1.05}
.t3{font-size:13px;font-weight:600;color:var(--muted);line-height:1.15}

/* the material: one cut-paper piece for every interface element */
.pc{background:var(--paper);border-radius:6px;filter:var(--edge)}
.pc.y{background:var(--turmeric)}
.pc.r{background:var(--tomato);color:#fff}
.pc.r .t3{color:#FFE9E3}
/* standees: upright cut-outs with a ground shadow */
.st{position:absolute;display:grid;justify-items:center}
.st img{width:100%;filter:var(--edge);position:relative;z-index:1}
.st::after{content:"";width:70%;height:10px;margin-top:-7px;border-radius:50%;background:rgba(43,31,22,.28)}

/* HUD: three pieces of the same card along the top */
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:stretch;z-index:6}
.hud .pc{padding:5px 9px;display:flex;align-items:center;gap:7px}
.lv{width:28px;height:28px;border-radius:50%;background:var(--turmeric);display:grid;place-items:center;font-weight:800;font-size:16px}
.hp{width:80px;height:8px;background:#EADCC2;border-radius:2px;overflow:hidden;margin-top:2px}
.hp i{display:block;height:100%;background:var(--tomato)}
.coins{margin-left:auto}
.coins img{width:22px;height:22px}
.sq{width:38px;justify-content:center}

/* bottom actions: the same card, primary in tomato */
.act{position:absolute;left:12px;right:12px;bottom:18px;z-index:6;display:grid;gap:8px}
.act.two{grid-template-columns:1fr 1.5fr}
.btn{padding:11px 10px 9px;text-align:center}
.btn .t2{font-size:22px}

/* hub: flat floor sheet, back wall sheet, stations as standees with name cards */
.wall{position:absolute;left:0;right:0;top:0;height:200px;background:#2F7F7C}
.floorline{position:absolute;left:0;right:0;top:196px;height:8px;background:#fff}
.name{position:absolute;z-index:5;padding:3px 9px 2px;text-align:center}
.name .t3{color:var(--muted)}
.say{position:absolute;left:12px;right:12px;bottom:96px;z-index:6;padding:8px 10px;display:flex;gap:9px;align-items:center}
.say img{width:32px;height:32px}

/* kitchen */
.kit{position:absolute;inset:0;padding:64px 12px 0;display:grid;gap:10px;align-content:start}
.menu{padding:10px 12px 8px;display:grid;gap:1px}
.mr{display:flex;align-items:baseline;gap:6px}
.mr .k{font-size:15px;font-weight:600}
.mr .dots{flex:1;border-bottom:2px dotted #D3C2A2;transform:translateY(-4px)}
.mr .v{font-size:22px;font-weight:800;line-height:1}
.mr .d{font-size:13px;font-weight:800;color:var(--leafInk);min-width:30px;text-align:right}
.menu .t3{border-top:2px dashed #E6D7BA;padding-top:5px;margin-top:4px}
.lab{display:flex;justify-content:space-between;align-items:baseline;color:var(--ink)}
.lab .t3{color:#4E3E2C}
.roti{display:flex;gap:10px;align-items:center;padding:6px 10px}
.roti img{width:44px;height:44px}
.bowls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bowl{display:grid;justify-items:center;gap:2px;text-align:center;padding:7px 4px 6px}
.bowl img{width:40px;height:40px}
.bowl.sel{background:var(--turmeric)}
.bowl.sel .t3{color:var(--leafInk);font-weight:800}
.bowl.empty{background:transparent;filter:none;border:2.5px dashed #8A6E4C}
.bowl.empty .plus{width:40px;height:40px;display:grid;place-items:center;font-size:24px;font-weight:800;color:#6E5638}
.gear{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.g{aspect-ratio:1;display:grid;place-items:center;position:relative;max-width:100%}
.g img{width:32px;height:32px}
.g i{position:absolute;right:4px;bottom:1px;font-style:normal;font-weight:800;font-size:13px}

/* run: flat road sheet, kerb sheets, prop standees along the kerbs */
.road{position:absolute;top:0;bottom:0;left:52px;right:52px;background:var(--road)}
.road::before,.road::after{content:"";position:absolute;top:0;bottom:0;width:6px;background:#fff}
.road::before{left:-3px}.road::after{right:-3px}
.dash{position:absolute;top:0;bottom:0;left:50%;width:6px;transform:translateX(-50%);background:repeating-linear-gradient(var(--paper) 0 28px,transparent 28px 60px)}
.kerb{position:absolute;top:0;bottom:0;width:52px;background:#B48D5D}
.kerb.l{left:0}.kerb.r{right:0}
/* effects: flat paper shapes, same edge */
.fx{position:absolute;filter:var(--edge)}
.crunch{width:84px;height:84px;background:var(--turmeric);clip-path:polygon(50% 0,61% 30%,95% 18%,72% 45%,100% 62%,66% 66%,72% 100%,50% 75%,26% 98%,32% 66%,0 58%,28% 44%,6% 14%,40% 30%);display:grid;place-items:center;font-weight:800;font-size:15px}
.splat{width:118px;height:90px;background:#C77A22;border-radius:46% 54% 42% 58% / 55% 45% 55% 45%}
.splat::before{content:"";position:absolute;width:24px;height:11px;left:24px;top:16px;background:rgba(255,255,255,.6);border-radius:50%;transform:rotate(-20deg)}
.drop{background:#C77A22;border-radius:50%}
.dough{width:78px;height:66px;background:#F2DFB8;border-radius:52% 48% 60% 40% / 50% 58% 42% 50%;opacity:.95}
.dmg{position:absolute;z-index:5;font-weight:800;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;line-height:1}
.prata{position:absolute;width:28px;filter:var(--edge);z-index:4}
.dodge{position:absolute;right:12px;bottom:18px;z-index:6;width:76px;height:76px;display:grid;place-items:center}

/* results: the order slip is the same card, torn at the bottom */
.slip{position:absolute;left:16px;right:16px;top:64px;padding:14px 14px 18px;display:grid;gap:3px}
.big{text-align:center;font-size:46px;font-weight:800;line-height:.95;color:var(--tomato)}
.li{display:flex;gap:6px;align-items:center}
.li img{width:24px;height:24px}
.li .dots{flex:1;border-bottom:2px dotted #D3C2A2;transform:translateY(-3px)}
.li b{font-weight:800}
.li .g{color:var(--leafInk)}
.slip hr{border:0;border-top:2px dashed #E6D7BA;margin:5px 0;width:100%}
.next{position:absolute;left:12px;right:12px;bottom:92px;z-index:6;padding:7px 10px;display:flex;align-items:center;gap:8px}
.next img{width:28px;height:28px}
.next .go{margin-left:auto;font-weight:800;font-size:20px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
